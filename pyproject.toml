[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muar-sfc"
version = "1.0.0"
description = "Simulador de Immersive Services e SFC"
authors = [
    { name = "Hugo Leonardo", email = "hugosantos@ufpa.br" }
]
# Fixado para o Python 3.12, base do seu ambiente atual
requires-python = ">=3.12"
dependencies = [
    "stable-baselines3",
    "pandas",
    "matplotlib",
    "numpy",
    "simpy",
    "sumo", # Nota: se for o simulador de tráfego Eclipse SUMO, geralmente usa-se 'sumolib' e 'traci' no PyPI
    "scipy",
    "shapely",
    "deap",
    "tensorboard",
    "seaborn",
    "pytz",
    "sb3-contrib>=2.7.1",
    "traci>=1.26.0",
    "pydantic-settings>=2.13.1",
]

# Separação de escopo (Separation of Concerns) para ferramentas de Dev
[project.optional-dependencies]
dev = [
    "ipykernel",
    "nbformat",
    "ruff",    # O linter/formatador ultrarrápido padrão da indústria
    "pytest"   # O framework de testes padrão absoluto
]

# Configurações centralizadas de ferramentas
[tool.ruff]
extend-exclude = ["*.ipynb"]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
# Ativando as regras sêniores de engenharia
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (ordenação de imports)
    "B",   # flake8-bugbear (bugs comuns e problemas de design)
    "UP",  # pyupgrade (força sintaxe moderna do Python 3.12)
    "SIM", # flake8-simplify (simplifica lógicas redundantes)
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]


[tool.hatch.build.targets.wheel]
packages = ["src/muar_sfc"]

[dependency-groups]
dev = [
    "ruff>=0.15.5",
]

# --- Configuração do Pyright ajustada para Tipagem Gradual ---
[tool.pyright]
include = ["src"]
exclude = [
    "**/__pycache__", 
    ".venv", 
    ".ruff_cache",
    ".git",
    "tests"
]
# Reduzindo para 'basic' para focar em erros de sintaxe e tipagens já declaradas, 
# sem exigir "Type Completeness" do projeto legado todo.
typeCheckingMode = "basic"

# Desligando os alertas específicos de inferência dinâmica ("Unknown") 
# para silenciar o ruído nos módulos que ainda não foram refatorados.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false